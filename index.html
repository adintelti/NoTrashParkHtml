<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>No Trash Park - Browser Demo</title>
    <link rel="stylesheet" href="styles.css">
    <script src="src/constants.js" defer></script>
    <script src="src/data.js" defer></script>
    <script src="src/dom.js" defer></script>
    <script src="src/state.js" defer></script>
    <script src="src/utils.js" defer></script>
    <script src="src/board.js" defer></script>
    <script src="src/config.js" defer></script>
    <script src="src/ui.js" defer></script>
    <script src="src/audio.js" defer></script>
    <script src="src/gameplay.js" defer></script>
    <script src="src/input-gamepad.js" defer></script>
    <script src="src/events.js" defer></script>
    <script src="src/loop.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <div id="app" class="app">
      <section id="menuScreen" class="screen menu-screen" aria-label="Main menu">
        <div class="menu-world" aria-hidden="true">
          <div class="cloud cloud-a"></div>
          <div class="cloud cloud-b"></div>
          <div class="menu-path"></div>
          <div class="menu-creature creature-a"></div>
          <div class="menu-creature creature-b"></div>
          <div class="menu-tower tower-a"></div>
          <div class="menu-tower tower-b"></div>
        </div>

        <div class="title-mark" aria-label="No Trash Park">
          <div class="logo-block">NTP</div>
          <h1>No Trash Park</h1>
        </div>

        <div id="versionText" class="version-text" aria-label="Game version"></div>

        <div id="menuGamepadHints" class="controller-hints menu-controller-hints" aria-label="Gamepad menu controls">
          <div class="hint-chip">
            <span class="pad-key pad-key-wide" aria-hidden="true">LS</span>
            <span class="pad-key pad-key-dpad" aria-hidden="true"></span>
            <span>Navegar</span>
          </div>
          <div class="hint-chip">
            <span class="pad-key pad-key-face is-a" aria-hidden="true">A</span>
            <span>Confirmar</span>
          </div>
          <div class="hint-chip">
            <span class="pad-key pad-key-face is-b" aria-hidden="true">B</span>
            <span>Voltar</span>
          </div>
          <div class="hint-chip">
            <span class="pad-key pad-key-dpad" aria-hidden="true"></span>
            <span>Ajustar</span>
          </div>
        </div>

        <nav class="menu-actions" aria-label="Menu">
          <button id="playButton" class="pixel-button menu-button" type="button">Jogar</button>
          <button id="configButton" class="pixel-button menu-button" type="button">Config.</button>
          <button id="exitButton" class="pixel-button menu-button" type="button">Sair</button>
        </nav>

        <div id="configPanel" class="config-panel" hidden>
          <!-- <div class="config-section">
            <div class="config-title">Fase inicial</div>
            <div class="segmented" role="group" aria-label="Starting theme">
              <button class="seg-button is-active" data-menu-theme="park" type="button">Parque</button>
              <button class="seg-button" data-menu-theme="lagoon" type="button">Lagoa</button>
              <button class="seg-button" data-menu-theme="lava" type="button">Fogo</button>
            </div>
          </div> -->

          <div class="config-section">
            <div class="config-title">Dificuldade</div>
            <div class="difficulty-grid" role="group" aria-label="Difficulty">
              <button class="seg-button" data-difficulty="easy" type="button">
                <span>Facil</span>
                <strong>5</strong>
              </button>
              <button class="seg-button is-active" data-difficulty="medium" type="button">
                <span>Medio</span>
                <strong>12</strong>
              </button>
              <button class="seg-button" data-difficulty="hard" type="button">
                <span>Dificil</span>
                <strong>20</strong>
              </button>
              <button class="seg-button" data-difficulty="custom" type="button">
                <span>Custom</span>
                <strong>20+</strong>
              </button>
            </div>

            <label class="waves-field" for="customWavesInput">
              <span>Ondas</span>
              <input id="customWavesInput" class="waves-input" type="text" inputmode="numeric" pattern="[0-9]*" value="20" aria-label="Custom wave count">
            </label>
          </div>

          <div class="config-section">
            <div class="config-title">Som</div>
            <div class="sound-toggle-grid" role="group" aria-label="Sound toggles">
              <button id="bgmToggleButton" class="seg-button is-active" data-sound-toggle="bgm" type="button">BGM On</button>
              <button id="sfxToggleButton" class="seg-button is-active" data-sound-toggle="sfx" type="button">SFX On</button>
            </div>

            <label class="sound-row" for="bgmVolumeInput">
              <span>BGM</span>
              <input id="bgmVolumeInput" class="sound-slider" data-sound-volume="bgm" type="range" min="0" max="100" step="5" value="100" aria-label="BGM master volume">
              <strong id="bgmVolumeText">100%</strong>
            </label>

            <label class="sound-row" for="sfxVolumeInput">
              <span>SFX</span>
              <input id="sfxVolumeInput" class="sound-slider" data-sound-volume="sfx" type="range" min="0" max="100" step="5" value="100" aria-label="SFX master volume">
              <strong id="sfxVolumeText">100%</strong>
            </label>
          </div>
        </div>
      </section>

      <section id="gameScreen" class="screen game-screen is-hidden" aria-label="Tower defense demo">
        <main class="game-layout">
          <section class="board-stage" aria-label="Battlefield">
            <div class="top-hud" aria-live="polite">
              <div class="stat-pill">
                <span class="heart-stack" id="heartStack" aria-hidden="true"></span>
                <span id="livesText">10</span>
              </div>
              <div class="stat-pill">
                <span>Wave</span>
                <strong id="waveText">0</strong>
              </div>
              <div class="stat-pill">
                <span>Tempo</span>
                <strong id="sessionTimeText">00:00</strong>
              </div>
            </div>

            <div id="board" class="board theme-park" data-testid="board"></div>
            <div id="floatingMessage" class="floating-message" aria-live="polite"></div>

            <div id="boardGamepadHints" class="controller-hints gameplay-board-hints" aria-label="Gamepad battlefield controls">
              <div class="hint-chip">
                <span class="pad-key pad-key-wide" aria-hidden="true">LS</span>
                <span class="pad-key pad-key-dpad" aria-hidden="true"></span>
                <span>Cursor</span>
              </div>
              <div class="hint-chip">
                <span class="pad-key pad-key-face is-a" aria-hidden="true">A</span>
                <span class="pad-key pad-key-trigger" aria-hidden="true">RT</span>
                <span>Construir</span>
              </div>
            </div>

            <div id="victoryOverlay" class="victory-overlay" role="dialog" aria-modal="true" aria-labelledby="victoryTitle" hidden>
              <div class="victory-card">
                <h2 id="victoryTitle">Parque Protegido!</h2>
                <p id="victorySummary" class="victory-summary"></p>
                <div class="victory-stats" aria-label="Resumo da sessao">
                  <div class="victory-stat">
                    <span>Tempo</span>
                    <strong id="victoryTimeText">00:00</strong>
                  </div>
                  <div class="victory-stat">
                    <span>Onda</span>
                    <strong id="victoryWaveText">0/0</strong>
                  </div>
                </div>
                <div class="victory-actions" aria-label="Opcoes de resultado">
                  <button id="victoryContinueButton" class="victory-choice" type="button">Continuar</button>
                  <button id="victoryRestartButton" class="victory-choice" type="button">Jogar novamente!</button>
                  <button id="victoryMenuButton" class="victory-choice" type="button">Menu</button>
                </div>
              </div>
            </div>
          </section>

          <aside class="shop-panel" aria-label="Shop">
            <div class="shop-top">
              <div class="money-readout" aria-label="Coins">
                <span class="coin-icon" aria-hidden="true">$</span>
                <span id="coinText">300</span>
              </div>
              <div class="shop-actions" aria-label="Acoes">
                <button id="restartButton" class="icon-button restart-icon-button" title="Reiniciar" aria-label="Reiniciar" type="button"></button>
                <button id="backToMenuButton" class="icon-button menu-icon-button" title="Menu" aria-label="Menu" type="button"></button>
              </div>
            </div>

            <div class="shop-title">SHOP</div>

            <div id="shopGamepadHints" class="controller-hints shop-gamepad-hints" aria-label="Gamepad shop controls">
              <div class="hint-chip">
                <span class="pad-key pad-key-trigger" aria-hidden="true">LB</span>
                <span class="pad-key pad-key-trigger" aria-hidden="true">RB</span>
                <span>Torre</span>
              </div>
              <div class="hint-chip">
                <span class="pad-key pad-key-face is-x" aria-hidden="true">X</span>
                <span>Pausa</span>
              </div>
              <div class="hint-chip">
                <span class="pad-key pad-key-face is-y" aria-hidden="true">Y</span>
                <span>Vel.</span>
              </div>
              <div class="hint-chip">
                <span class="pad-key pad-key-wide" aria-hidden="true">View</span>
                <span>Menu</span>
              </div>
            </div>

            <div id="towerShop" class="tower-shop" aria-label="Tower choices">
              <button class="shop-button is-active" data-tower="sentinel" type="button">
                <span>Sentinela</span>
                <strong>$100</strong>
              </button>
              <button class="shop-button" data-tower="slow" type="button">
                <span>Gelida</span>
                <strong>$75</strong>
              </button>
              <button class="shop-button" data-tower="splash" type="button">
                <span>Canhao</span>
                <strong>$125</strong>
              </button>
              <button class="shop-button" data-tower="flame" type="button">
                <span>Chama</span>
                <strong>$150</strong>
              </button>
            </div>

            <!-- <div class="theme-controls" role="group" aria-label="Level theme">
              <button class="small-button is-active" data-theme="park" type="button">Parque</button>
              <button class="small-button" data-theme="lagoon" type="button">Lagoa</button>
              <button class="small-button" data-theme="lava" type="button">Fogo</button>
            </div> -->

            <div class="control-row">
              <button id="pauseButton" class="shop-button wide" type="button">Pause</button>
              <button id="speedButton" class="shop-button wide" type="button">1x</button>
            </div>
          </aside>

          <div id="restartConfirmOverlay" class="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="restartConfirmTitle" hidden>
            <div class="confirm-card">
              <h2 id="restartConfirmTitle">Deseja realmente reiniciar o jogo?</h2>
              <div class="confirm-actions" aria-label="Confirmar reinicio">
                <button id="restartConfirmYesButton" class="pixel-button confirm-button" type="button">Sim</button>
                <button id="restartConfirmNoButton" class="pixel-button confirm-button" type="button">Não</button>
              </div>
            </div>
          </div>

          <div id="exitConfirmOverlay" class="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="exitConfirmTitle" hidden>
            <div class="confirm-card">
              <h2 id="exitConfirmTitle">Deseja realmente sair do jogo atual?</h2>
              <div class="confirm-actions" aria-label="Confirmar saida">
                <button id="exitConfirmYesButton" class="pixel-button confirm-button" type="button">Sim</button>
                <button id="exitConfirmNoButton" class="pixel-button confirm-button" type="button">Não</button>
              </div>
            </div>
          </div>
        </main>
      </section>
    </div>
  </body>
</html>
